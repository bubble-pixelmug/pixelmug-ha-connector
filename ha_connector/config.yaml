name: "PixelMug HA Connector"
description: "Outbound WebSocket connector that exposes a controlled Home Assistant Core API bridge."
version: "0.1.1"
slug: "pixelmug_ha_connector"
stage: experimental
startup: application
boot: auto
init: false
arch:
  - aarch64
  - amd64
homeassistant_api: true
options:
  server_url: "ws://your-server-host:port"
  token: null
  allow_insecure_ws: true
  access_mode: "control"
  enable_ha_websocket: true
  log_level: "info"
  request_timeout_ms: 15000
  max_payload_bytes: 4194304
  max_concurrent_requests: 16
  max_websocket_sessions: 4
  reconnect_initial_ms: 1000
  reconnect_max_ms: 30000
  heartbeat_interval_ms: 30000
  status_report_interval_ms: 60000
schema:
  server_url: str
  token: password
  allow_insecure_ws: bool
  access_mode: "list(read_only|control|admin)"
  enable_ha_websocket: bool
  log_level: "list(debug|info|warn|error)"
  request_timeout_ms: "int(1000,120000)"
  max_payload_bytes: "int(65536,16777216)"
  max_concurrent_requests: "int(1,64)"
  max_websocket_sessions: "int(0,16)"
  reconnect_initial_ms: "int(250,30000)"
  reconnect_max_ms: "int(1000,300000)"
  heartbeat_interval_ms: "int(5000,120000)"
  status_report_interval_ms: "int(0,3600000)"
