configuration:
  server_url:
    name: Connector server URL
    description: Outbound ws:// or wss:// server origin, for example ws://example.com:5880. The connector appends /ha/connect automatically.
  token:
    name: Connector token
    description: Token sent in the first register frame. Keep this secret.
  allow_insecure_ws:
    name: Allow insecure WebSocket
    description: Permit ws:// without TLS. Enable only for development.
  enable_ha_websocket:
    name: 启用 Home Assistant WebSocket 通道
    description: 允许透传 Home Assistant WebSocket API 会话；上游服务必须先完成授权。
  enable_ha_rest:
    name: 启用 Home Assistant REST 通道
    description: 允许通过 Connector 访问 Home Assistant Core REST API。
  allow_ha_rest_write:
    name: 允许 Home Assistant REST 写入
    description: 允许 POST、PUT、PATCH 和 DELETE；关闭时仅允许 GET 和 HEAD。
  log_level:
    name: Log level
    description: Connector logging verbosity.
