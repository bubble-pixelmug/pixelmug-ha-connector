configuration:
  server_url:
    name: Connector server URL
    description: Outbound ws:// or wss:// server origin, for example ws://example.com:5880. The connector appends /ha/connect automatically.
  token:
    name: Connector token
    description: Token sent in the first register frame. Keep this secret.
  allow_insecure_ws:
    name: Allow insecure WebSocket
    description: Permit ws:// without TLS. Enable only for development.
  enable_ha_websocket:
    name: Enable Home Assistant WebSocket bridge
    description: Permit opaque remote Home Assistant WebSocket API sessions. The upstream service must authorize access.
  enable_ha_rest:
    name: Enable Home Assistant REST bridge
    description: Permit remote Home Assistant Core REST API requests through the connector.
  allow_ha_rest_write:
    name: Allow Home Assistant REST writes
    description: Permit POST, PUT, PATCH and DELETE. When disabled, only GET and HEAD are accepted.
  log_level:
    name: Log level
    description: Connector logging verbosity.
